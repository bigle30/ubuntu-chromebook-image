name: Automated Patched Image Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y gdisk qemu-user-static wget xz-utils cgpt \
          make gcc-aarch64-linux-gnu bc libelf-dev flex bison python3-pip golang-go

      - name: Setup Go & Submarine Tools
        run: |
          # Patch: Ensure u-root is in the executable path for the Makefile
          go install github.com/u-root/u-root@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
          # Patch: Install tools into the user environment to avoid sudo/root conflicts
          pip3 install --break-system-packages depthcharge-tools

      - name: Build Submarine from Source (Patched)
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/FyraLabs/submarine build-submarine
          cd build-submarine
          
          # Patch: Run compilation for MT8186/ARM64
          make -j$(nproc) arm64
          
          # Patch: Explicitly bypass host /boot directory to fix Permission Denied (Errno 13)
          # This forces the packager to only use the local 'build' folder
          depthchargectl build -v \
            --board arm64-generic \
            --kernel build/bzImage.a64 \
            --initramfs build/initramfs-arm64.cpio.gz \
            --fdtdir build/dtbs \
            --root none \
            --kernel-cmdline "console=tty0" \
            --output build/submarine-arm64.kpart

          # Prepare gadget for the main Ubuntu image build
          mkdir -p ../gadget
          cp build/submarine-arm64.kpart ../gadget/submarine-a64.kpart

      - name: Build Ubuntu Image
        run: |
          sudo modprobe loop
          # Patch: Use ubuntu-image to wrap everything into the .img
          # Assumes chromebook-corsola-desktop.yaml is in your repo root
          sudo ubuntu-image classic -i 8G chromebook-corsola-desktop.yaml --output corsola-ubuntu.img

      - name: Patch Partition Flags
        run: |
          # Crucial for Magenton: mark Partition 1 as Priority 10 and Successful
          # Without this, the Chromebook will skip the USB/SD card during boot
          sudo cgpt add -i 1 -S 1 -T 1 -P 10 corsola-ubuntu.img

      - name: Compress and Release
        run: |
          xz -T0 -9 corsola-ubuntu.img
          mv corsola-ubuntu.img.xz ubuntu-corsola-patched-$(date +%Y%m%d).img.xz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-corsola-patched
          path: "*.img.xz"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.img.xz"
