name: Build Ubuntu Corsola

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Enable manual run button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils vboot-utils vboot-kernel-utils sgdisk gdisk
          sudo snap install --classic ubuntu-image

      - name: Create Suspend Fix Overlay
        run: |
          mkdir -p overlay/etc/systemd/system/multi-user.target.wants/
          cat <<EOF > overlay/etc/systemd/system/cros-ec-suspend-fix.service
[Unit]
Description=Fix Magneton Suspend Timeout
After=sys-kernel-debug.mount
[Service]
Type=oneshot
ExecStart=/bin/sh -c 'echo 65535 > /sys/kernel/debug/cros_ec/suspend_timeout_ms'
[Install]
WantedBy=multi-user.target
EOF
          ln -s /etc/systemd/system/cros-ec-suspend-fix.service \
          overlay/etc/systemd/system/multi-user.target.wants/cros-ec-suspend-fix.service

      - name: Fetch Submarine
        run: |
          wget https://nightly.link/FyraLabs/submarine/workflows/build/main/submarine-arm64.zip
          unzip -j submarine-arm64.zip submarine-a64.kpart -d .
          echo "console=tty1 root=LABEL=writable rootwait rw ignore_loglevel cros_ec.mod_delay_ms=2000" > cmdline.txt
          vbutil_kernel --repack submarine-a64.kpart --oldblob submarine-a64.kpart --config cmdline.txt

      - name: Build Image
        run: |
          # Note: Ensure corsola.yaml exists in your repo root
          sudo ubuntu-image classic -i 8G --output ubuntu-corsola.img --overlay-dir overlay/ corsola.yaml

      - name: Set Boot Flags
        run: sudo sgdisk -A 1:or:11f000000000000 ubuntu-corsola.img

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-corsola-fixed
          path: ubuntu-corsola.img
