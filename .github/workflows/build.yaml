name: Automated image builds

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y gdisk qemu-user-static wget xz-utils cgpt \
          make gcc-aarch64-linux-gnu bc libelf-dev flex bison python3-pip golang-go

      - name: Setup Go & Submarine Tools
        run: |
          # Install u-root and ensure it's in the PATH for the next steps
          go install github.com/u-root/u-root@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
          # Install depthcharge-tools to sign the Chromebook kernel partition
          # Using --break-system-packages is safe in an ephemeral GH Action runner
          pip3 install --break-system-packages depthcharge-tools

      - name: Build Submarine from Source
        run: |
          # Shallow clone to save time/space
          git clone --recurse-submodules --depth 1 https://github.com/FyraLabs/submarine build-submarine
          cd build-submarine
          
          # Cross-compile for the MT8186 (Corsola/Magenton) architecture
          # -j$(nproc) uses all available CPU cores
          make -j$(nproc) arm64
          
          # Prepare the gadget directory for ubuntu-image
          mkdir -p ../gadget
          cp build/submarine-arm64.kpart ../gadget/submarine-a64.kpart

      - name: Build Ubuntu Image
        run: |
          # Essential for ubuntu-image to mount the filesystem
          sudo modprobe loop
          
          # Run the build. 
          # Ensure chromebook-corsola-desktop.yaml is in your repo root.
          sudo ubuntu-image classic -i 8G chromebook-corsola-desktop.yaml --output corsola-ubuntu.img

      - name: Apply ChromeOS Boot Flags
        run: |
          # Depthcharge firmware requires specific GPT priority bits
          # -P 10 sets high priority, -S 1 marks as a successful boot partition
          sudo cgpt add -i 1 -S 1 -T 1 -P 10 corsola-ubuntu.img

      - name: Compress and Finalize
        run: |
          # Maximize compression to stay under artifact limits
          xz -T0 -9 corsola-ubuntu.img
          mv corsola-ubuntu.img.xz ubuntu-corsola-$(date +%Y%m%d).img.xz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-corsola-full-build
          path: "*.img.xz"
